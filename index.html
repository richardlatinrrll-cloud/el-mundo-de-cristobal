<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1b2a" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <title>El Mundo de Cristóbal</title>
    <link rel="stylesheet" href="./src/style.css" />
    <style>
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; text-align: center;
        padding: 24px; background: #0d1b2a; color: #e8eef7;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #boot .t { font-size: 22px; font-weight: 800; }
      #boot .s { color: #9fb2cc; font-size: 14px; max-width: 340px; }
      #boot .err { color: #f8b4b4; font-size: 13px; white-space: pre-wrap; }
      #boot button {
        margin-top: 6px; font: inherit; font-weight: 700; padding: 10px 18px;
        border: none; border-radius: 12px; background: #ffd166; color: #1a1a1a;
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="t">⛏️ El Mundo de Cristóbal</div>
      <div class="s" id="boot-msg">Cargando…</div>
      <div class="err" id="boot-err" hidden></div>
      <button id="boot-reload" hidden onclick="location.reload(true)">Reintentar</button>
      <noscript><div class="s">Este juego necesita JavaScript activado.</div></noscript>
    </div>
    <div id="app"></div>
    <script>
      // Si en 12 s no arrancó el juego, o si algo falla, mostrar un aviso claro
      window.__booted = false;
      var bt = setTimeout(function () {
        if (window.__booted) return;
        var m = document.getElementById('boot-msg');
        if (m) m.textContent = 'Está tardando en cargar. Revisa tu conexión (o WiFi / Tailscale) y reintenta.';
        var b = document.getElementById('boot-reload'); if (b) b.hidden = false;
      }, 12000);
      window.addEventListener('error', function (e) {
        if (window.__booted) return;
        var el = document.getElementById('boot-err');
        if (el && e && e.message) { el.hidden = false; el.textContent = 'Error: ' + e.message; }
        var b = document.getElementById('boot-reload'); if (b) b.hidden = false;
        clearTimeout(bt);
      });
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
